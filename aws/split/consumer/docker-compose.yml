name: coupon-consumer

services:
  coupon-consumer:
    image: eclipse-temurin:17-jre
    command: java -Xmx512m -jar /app.jar
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST:?set DB_HOST in .env}:3306/coupon?rewriteBatchedStatements=true
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA1_HOST:?set KAFKA1_HOST in .env}:9092,${KAFKA2_HOST:?set KAFKA2_HOST in .env}:9092,${KAFKA3_HOST:?set KAFKA3_HOST in .env}:9092
    volumes:
      - ../../../coupon-consumer/build/libs/coupon-consumer-0.0.1.jar:/app.jar:ro
    restart: on-failure
