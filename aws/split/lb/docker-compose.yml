name: coupon-lb

services:
  nginx:
    image: nginx:1.27.2
    ports:
      - "8080:8080"
    environment:
      API1_HOST: ${API1_HOST:?set API1_HOST in .env}
      API2_HOST: ${API2_HOST:?set API2_HOST in .env}
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ulimits:
      nofile: 65535

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    ports:
      - "9113:9113"
    command:
      - "--nginx.scrape-uri=http://nginx:8081/stub_status"
    restart: always
    depends_on:
      - nginx

  node-exporter:
    image: prom/node-exporter:v1.8.1
    ports:
      - "9100:9100"
