name: coupon-infra

services:
  mysql:
    image: mysql:8.0.34
    command:
      - --innodb-buffer-pool-size=256M
      - --innodb-flush-log-at-trx-commit=2
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: coupon

  redis:
    image: redis:7.0.15
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${INFRA_HOST:?set INFRA_HOST in .env}:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms400m -Xmx400m"
    depends_on:
      - zookeeper

  redis-exporter:
    image: oliver006/redis_exporter:v1.59.0
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis://redis:6379

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    ports:
      - "9308:9308"
    command:
      - "--kafka.server=kafka:29092"
    restart: always
    depends_on:
      - kafka

  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    ports:
      - "9104:9104"
    command:
      - "--mysqld.address=mysql:3306"
      - "--mysqld.username=root:1234"
    restart: always
    depends_on:
      - mysql
