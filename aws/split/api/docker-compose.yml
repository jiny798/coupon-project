name: coupon-api

services:
  coupon-api:
    image: eclipse-temurin:17-jre
    command: java -Xmx512m -jar /app.jar
    ports:
      - "8080:8080"
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST:?set DB_HOST in .env}:3306/coupon
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:?set REDIS_HOST in .env}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA1_HOST:?set KAFKA1_HOST in .env}:9092,${KAFKA2_HOST:?set KAFKA2_HOST in .env}:9092,${KAFKA3_HOST:?set KAFKA3_HOST in .env}:9092
      COUPON_KAFKA_PRODUCERS: ${KAFKA_PRODUCERS:-1}
    volumes:
      - ../../../coupon-api/build/libs/coupon-api-0.0.1.jar:/app.jar:ro
    restart: on-failure
