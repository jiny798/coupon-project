spring:
  datasource:
    url: jdbc:mysql://localhost:3306/coupon
    username: root
    password: 1234
  jpa:
    hibernate:
      ddl-auto: update

server:
  tomcat:
    mbeanregistry:
      enabled: true

management:
  server:
    port: 8082
  endpoints:
    web:
      exposure:
        include: prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
