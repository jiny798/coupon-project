apiVersion: 1

datasources:
  - name: prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: k6-influxdb
    uid: influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    database: k6

  - name: coupon-mysql
    uid: mysql
    type: mysql
    url: mysql:3306
    user: root
    jsonData:
      database: coupon
    secureJsonData:
      password: "1234"
